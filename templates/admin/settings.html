{% extends 'admin/base.html' %}

{% block content %}
<div class="admin-card">
    <h3><i class="fa-solid fa-gear me-2"></i>Site Settings</h3>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="school_name" class="form-label">School Name</label>
                <input type="text" class="form-control" id="school_name" name="school_name" value="{{ settings.school_name }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="tagline" class="form-label">Tagline</label>
                <input type="text" class="form-control" id="tagline" name="tagline" value="{{ settings.tagline }}">
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="phone" class="form-label">Phone</label>
                <input type="text" class="form-control" id="phone" name="phone" value="{{ settings.phone }}">
            </div>
            <div class="col-md-6 mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ settings.email }}">
            </div>
        </div>
        <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <textarea class="form-control" id="address" name="address" rows="3">{{ settings.address }}</textarea>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="logo" class="form-label">Logo</label>
                <input type="file" class="form-control" id="logo" name="logo">
                {% if settings.logo %}
                    <div class="mt-2">
                        <small class="text-muted">Current logo:</small><br>
                        <img src="{{ settings.logo.url }}" alt="Current Logo" style="max-height: 60px; margin-top: 5px;">
                    </div>
                {% endif %}
            </div>
            <div class="col-md-6 mb-3">
                <label for="favicon" class="form-label">Favicon</label>
                <input type="file" class="form-control" id="favicon" name="favicon">
                {% if settings.favicon %}
                    <div class="mt-2">
                        <small class="text-muted">Current favicon:</small><br>
                        <img src="{{ settings.favicon.url }}" alt="Current Favicon" style="max-height: 32px; margin-top: 5px;">
                    </div>
                {% endif %}
            </div>
        </div>
        <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-save me-2"></i>Save Settings
        </button>
    </form>
</div>
{% endblock %}
