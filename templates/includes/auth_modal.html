<!-- Login & Register Modal for Visitors -->
<div class="modal fade" id="authModal" tabindex="-1" aria-labelledby="authModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
      <div class="modal-header border-0 pb-0" style="background-color: var(--primary-navy);">
        <h5 class="modal-title text-white fw-bold d-flex align-items-center gap-2" id="authModalLabel">
          <i class="fa-solid fa-graduation-cap text-warning fs-4"></i> Jaljala Student & Portal Account
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body p-4 bg-light">
        <!-- Auth Navigation Tabs -->
        <ul class="nav nav-pills nav-justified mb-4 p-1 bg-white rounded-3 shadow-sm" id="authTab" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active font-weight-bold" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-panel" type="button" role="tab" aria-controls="login-panel" aria-selected="true">
              <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link font-weight-bold" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-panel" type="button" role="tab" aria-controls="register-panel" aria-selected="false">
              <i class="fa-solid fa-user-plus me-1"></i> Register Account
            </button>
          </li>
        </ul>

        <div class="tab-content" id="authTabContent">
          <!-- LOGIN PANEL -->
          <div class="tab-pane fade show active" id="login-panel" role="tabpanel" aria-labelledby="login-tab">
            <!-- Google Login Button -->
            <a href="/login/google" class="btn btn-outline-dark w-100 py-2.5 mb-3 d-flex align-items-center justify-content-center gap-2 bg-white shadow-sm fw-bold border-secondary-subtle hover-shadow">
              <svg width="20" height="20" viewBox="0 0 48 48">
                <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
                <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
              </svg>
              <span>Continue with Google</span>
            </a>

            <div class="d-flex align-items-center my-3">
              <hr class="flex-grow-1">
              <span class="px-2 text-muted small fw-bold">OR LOGIN WITH EMAIL</span>
              <hr class="flex-grow-1">
            </div>

            <form method="POST" action="/login">
              {% csrf_token %}
              <div class="mb-3">
                <label class="form-label font-weight-bold small">Username or Email *</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your username or email" required>
              </div>
              <div class="mb-3">
                <label class="form-label font-weight-bold small">Password *</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
              </div>
              <button type="submit" class="btn btn-navy w-100 py-2 font-weight-bold mt-2">
                <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In to Portal
              </button>
            </form>
          </div>

          <!-- REGISTER PANEL -->
          <div class="tab-pane fade" id="register-panel" role="tabpanel" aria-labelledby="register-tab">
            <!-- Google Login Button -->
            <a href="/login/google" class="btn btn-outline-dark w-100 py-2.5 mb-3 d-flex align-items-center justify-content-center gap-2 bg-white shadow-sm fw-bold border-secondary-subtle hover-shadow">
              <svg width="20" height="20" viewBox="0 0 48 48">
                <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
                <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
              </svg>
              <span>Sign Up with Google</span>
            </a>

            <div class="d-flex align-items-center my-3">
              <hr class="flex-grow-1">
              <span class="px-2 text-muted small fw-bold">OR REGISTER WITH EMAIL</span>
              <hr class="flex-grow-1">
            </div>

            <form method="POST" action="/register">
              {% csrf_token %}
              <div class="row g-2 mb-2">
                <div class="col-6">
                  <label class="form-label font-weight-bold small">First Name *</label>
                  <input type="text" name="first_name" class="form-control" placeholder="First Name" required>
                </div>
                <div class="col-6">
                  <label class="form-label font-weight-bold small">Last Name *</label>
                  <input type="text" name="last_name" class="form-control" placeholder="Last Name" required>
                </div>
              </div>
              <div class="mb-2">
                <label class="form-label font-weight-bold small">Username *</label>
                <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
              </div>
              <div class="mb-2">
                <label class="form-label font-weight-bold small">Email Address *</label>
                <input type="email" name="email" class="form-control" placeholder="Email address" required>
              </div>
              <div class="mb-2">
                <label class="form-label font-weight-bold small">Password *</label>
                <input type="password" name="password" class="form-control" placeholder="Create password" required>
              </div>
              <div class="mb-3">
                <label class="form-label font-weight-bold small">Confirm Password *</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Confirm password" required>
              </div>
              <button type="submit" class="btn btn-gold w-100 py-2 font-weight-bold">
                <i class="fa-solid fa-user-plus me-1"></i> Create Account
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
